[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "threatlens"
version = "0.1.0"
description = "Network Threat Detection & Security Analysis Platform"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["threatlens", "threatlens.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
